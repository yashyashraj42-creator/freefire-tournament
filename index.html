<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="🔥 Free Fire Tournament">
  <meta property="og:description" content="Join our Free Fire Tournament! Click Let's Go to continue.">
  <meta property="og:type" content="website">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🔥 Free Fire Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
      background: #1c1c1c;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 80, 0, 0.5);
    }

    .banner {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 28px 20px 35px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #ff8c00;
    }

    .subtitle {
      font-size: 17px;
      color: #ddd;
      margin-bottom: 20px;
    }

    .info {
      font-size: 15px;
      line-height: 1.8;
      color: #ccc;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      background: #ff6a00;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 45px;
      border-radius: 50px;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
      background: #ff4500;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Tournament Image -->
    <img
      class="banner"
      src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=80"
      alt="Gaming Tournament">

    <div class="content">

      <h1>🔥 FREE FIRE TOURNAMENT</h1>

      <p class="subtitle">
        Welcome to the Grand Tournament 🎮
      </p>

      <div class="info">
        🏆 Show your skills<br>
        🎮 Fair Play Tournament<br>
        ⚡ Exciting Matches<br>
        🔥 Get Ready to Battle
      </div>

      <!-- फिलहाल यह demo button है -->
      <a class="button" href="#">
        LET'S GO 🚀
      </a>

      <div class="footer">
        Tournament Registration Portal
      </div>

    </div>

  </div>

</body>
</html>
